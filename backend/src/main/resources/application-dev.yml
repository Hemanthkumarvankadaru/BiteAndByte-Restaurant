# Local development: in-memory H2, no install needed. Data resets on restart.
spring:
  datasource:
    url: jdbc:h2:mem:biteandbyte;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

biteandbyte:
  jwt:
    # Local development only. Every other profile must set BITEANDBYTE_JWT_SECRET.
    secret: ${BITEANDBYTE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
